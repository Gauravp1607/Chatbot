{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="section-block">
    <div class="container site-container">
        <div class="page-card auth-card reveal text-center">
            <h2>{{ title }}</h2>
            <p class="mt-3">{{ message }}</p>
            <p class="text-muted">{{ details }}</p>
            <p class="mt-3">{{ suggestion }}</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary mt-4">Back to homepage</a>
        </div>
    </div>
</section>
{% endblock %}
