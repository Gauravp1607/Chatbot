{% extends 'base.html' %}
{% block title %}Login | LivestockAI{% endblock %}

{% block styles %}
<link href="{{ url_for('static', filename='css/support-pages.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<section class="section-block">
    <div class="container site-container">
        <div class="page-card auth-card reveal">
            <h2>Login</h2>
            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" name="email" placeholder="you@example.com" autocomplete="username" maxlength="254" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter your password" autocomplete="current-password" maxlength="128" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-hero w-100">Login</button>
            </form>
            <div class="auth-helper-row">
                <p class="mb-0 text-small">Don’t have an account? <a href="{{ url_for('register', next=next) }}">Create one</a></p>
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
            </div>
            <p class="auth-footer text-center mt-3">By logging in, you agree to LivestockAI’s <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
    </div>
</section>
{% endblock %}
