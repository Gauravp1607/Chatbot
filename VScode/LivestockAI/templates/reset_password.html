{% extends 'base.html' %}
{% block title %}Reset Password | LivestockAI{% endblock %}

{% block styles %}
<link href="{{ url_for('static', filename='css/support-pages.css') }}" rel="stylesheet">
{% endblock %}

{% block content %}
<section class="section-block">
    <div class="container site-container">
        <div class="page-card auth-card reveal">
            <h2>Reset password</h2>
            <p class="mb-3 text-muted">Resetting password for <strong>{{ email }}</strong></p>
            <form method="post" action="{{ url_for('reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control" name="password" placeholder="Create a new password" autocomplete="new-password" minlength="8" maxlength="128" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,128}" title="Use 8 to 128 characters, including at least one letter and one number." required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm password</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" minlength="8" maxlength="128" required>
                </div>
                <button type="submit" class="btn btn-hero w-100">Set new password</button>
            </form>
            <p class="mt-4 text-center">Remembered your password? <a href="{{ url_for('login') }}">Sign in</a></p>
        </div>
    </div>
</section>
{% endblock %}
